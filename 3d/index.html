<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wolfy 3D</title><script type="module" src="mv.js"></script>
<style>*{box-sizing:border-box;margin:0}body{background:#D0DAE3;color:#3D4245;font-family:-apple-system,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:640px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 16px 24px}
h1{color:#002FA7;font-size:28px;letter-spacing:-.5px}p{color:#71767C;font-size:14px;margin-top:4px}
model-viewer{display:block;width:100%;height:min(68vh,620px);margin-top:14px;border-radius:24px;background:radial-gradient(circle at 50% 45%,#fff,#E6EEF5 70%);--poster-color:transparent}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.row button{flex:1;min-height:44px;border:0;border-radius:14px;background:#fff;color:#002FA7;font:700 14px -apple-system,system-ui;box-shadow:0 2px 8px rgba(61,66,69,.08)}
.row button.on{background:#002FA7;color:#fff}</style></head><body><main class="wrap">
<h1>Wolfy · Cub 3D</h1><p>Arrastra para girar 360° · pellizca para acercar</p>
<model-viewer id="mv" src="wolfy_stage1.glb" alt="Wolfy en 3D" camera-controls auto-rotate rotation-per-second="20deg" shadow-intensity="0.6" exposure="1.05" environment-image="neutral" camera-orbit="90deg 75deg auto" interaction-prompt="none" touch-action="pan-y"></model-viewer>
<div class="row"><button data-o="90deg">Frente</button><button data-o="0deg">Perfil</button><button data-o="270deg">Espalda</button><button id="ar" class="on">Girar solo</button></div>
</main><script>
const mv=document.getElementById('mv');
document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{ mv.autoRotate=false; document.getElementById('ar').classList.remove('on'); mv.cameraOrbit=b.dataset.o+' 75deg auto'; });
document.getElementById('ar').onclick=e=>{ mv.autoRotate=!mv.autoRotate; e.target.classList.toggle('on',mv.autoRotate); };
</script></body></html>
