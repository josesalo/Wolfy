function pupFig(stage, mood='neutral', worn=[], cls=''){
  const i = stage+1, m = PUP_META[i], ar = m.ar, VW = Math.round(ar*1000);
  const ex = p => (p[0]*VW/100).toFixed(1), ey = p => (p[1]*10).toFixed(1);
  const rx = m.ew*VW/200, ry = m.eh*5;
  const eye = p => { const x = +ex(p), y = +ey(p); return `<g class="e1"><ellipse cx="${x}" cy="${y}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" fill="url(#eg${i})"/><ellipse cx="${(x+rx*.33).toFixed(1)}" cy="${(y-ry*.35).toFixed(1)}" rx="${(rx*.28).toFixed(1)}" ry="${(ry*.27).toFixed(1)}" fill="#fff"/><circle cx="${(x-rx*.38).toFixed(1)}" cy="${(y+ry*.42).toFixed(1)}" r="${(rx*.12).toFixed(1)}" fill="#fff" opacity=".7"/></g>`; };
  const arc = (p, up) => { const x = +ex(p), y = +ey(p); return up
      ? `<path d="M${(x-rx*1.05).toFixed(1)} ${(y+ry*.35).toFixed(1)} Q${x} ${(y-ry*1.25).toFixed(1)} ${(x+rx*1.05).toFixed(1)} ${(y+ry*.35).toFixed(1)}"/>`
      : `<path d="M${(x-rx*1.05).toFixed(1)} ${(y-ry*.1).toFixed(1)} Q${x} ${(y+ry*.9).toFixed(1)} ${(x+rx*1.05).toFixed(1)} ${(y-ry*.1).toFixed(1)}"/>`; };
  const sw = (rx*.55).toFixed(1);
  const eyes = `<svg class="eyes" viewBox="0 0 ${VW} 1000" preserveAspectRatio="none"><defs><radialGradient id="eg${i}" cx=".45" cy=".62" r=".6"><stop offset="0" stop-color="#6E4A3F"/><stop offset=".7" stop-color="#4A3029"/><stop offset="1" stop-color="#3E2722"/></radialGradient></defs>
    <g class="eo">${eye(m.eyeL)}${eye(m.eyeR)}</g>
    <g class="ec" fill="none" stroke="#4A3029" stroke-width="${sw}" stroke-linecap="round">${arc(m.eyeL,1)}${arc(m.eyeR,1)}</g>
    <g class="es" fill="none" stroke="#4A3029" stroke-width="${sw}" stroke-linecap="round">${arc(m.eyeL,0)}${arc(m.eyeR,0)}</g></svg>`;
  const midX = (m.eyeL[0]+m.eyeR[0])/2, eyY = m.eyeL[1];
  const fx = id => {
    if (id==='medal'){ const w = m.sp*1.55; return `<img class="fx md" src="${IMG('fx_medal')}" alt="" style="left:${(midX-w/2).toFixed(1)}%;top:${(m.neck[1]-1.5).toFixed(1)}%;width:${w.toFixed(1)}%">`; }

  };
  return `<div class="pup m-${mood} ${cls}" style="aspect-ratio:${ar}">
    <img class="tl" src="${IMG('tail'+i)}" alt="" style="transform-origin:${m.piv[0]}% ${m.piv[1]}%">
    <div class="bd"><img class="bdi" src="${IMG('pup'+i)}" alt="">${eyes}${worn.map(fx).join('')}</div></div>`;
}

  const b = []; let mood = 'neutral';

  const doneToday = its.some(i=>['str','pool','med'].includes(i.type) && isDone(sess(d,i.kind)));
  if (bc.red) { mood = 'concerned'; b.push(['heart','Espalda','pbub','data-v="esp"']); }
  if (!c || !c.saved) b.push(['sun','Check-in','pbub','data-v="checkin"']);

  if (poolIt && !isDone(sess(d,'pool'))) b.push(['goggles','¡Piscina!','pbub','data-v="open:pool"']);
  if (medIt && !isDone(sess(d,'med'))) b.push(['leaf','Movilidad','pbub','data-v="open:med"']);
  if (p.st!=='ok') { b.push(['bowl','Hambre','pbub',`data-v="food:${p.next?p.next[0]:'noc'}"`]); if (mood==='neutral') mood = 'hungry'; }
  if (!n.creat && now >= 12*60) b.push(['jar','¿Creatina?','pbub','data-v="creat"']);
  const expW = Math.max(0, Math.min(8, Math.floor((now - 10*60)/90)));
  if ((n.water||0) < expW - 1) b.push(['drop','¡Agua!','pbub','data-v="water"']);
  if (now >= 19*60 && p.prot < S.cfg.prot*0.6) b.push(['shaker','Más proteína','pbub',`data-v="food:${p.next?p.next[0]:'noc'}"`]);

function comHero(d){
  const p = pace(d), n = nOf(d) || {}, now = nowMin();
  let mood = p.k >= p.T-100 ? 'proud' : p.st==='ok' ? 'happy' : 'hungry';
  const b = [];
  if (p.st!=='ok') b.push(['bowl', p.st==='bad'?'¡Tengo hambre!':'Un poco más', 'pbub', `data-v="food:${p.next?p.next[0]:'noc'}"`]);
  if (!n.creat && now >= 12*60) b.push(['jar','¿Creatina?','pbub','data-v="creat"']);
  const expW = Math.max(0, Math.min(8, Math.floor((now - 10*60)/90)));
  if ((n.water||0) < expW - 1) b.push(['drop','¡Agua!','pbub','data-v="water"']);
  if (now >= 15*60 && p.prot < S.cfg.prot * Math.min(1, (now-10*60)/(12*60)) * 0.7) b.push(['shaker','Proteína','pbub',`data-v="food:${p.next?p.next[0]:'noc'}"`]);
  if (!b.length && p.k >= p.T-100) b.push(['heart','¡Lleno!','pbub','data-v="pet"']);
  return petHero('kitchen', mood, b.slice(0,3));
}
function gaugesCard(d){
  const p = pace(d), n = nOf(d) || {};
  const fat = S.cfg.fat||90, carbs = Math.max(0, Math.round((p.T - S.cfg.prot*4 - fat*9)/4));
  const g = (kind, frac, label, val, act, done) => `<div class="gauge ${done?'done':''}" data-act="${act}">${gaugeSVG(kind, frac)}<div class="gv">${val}</div><div class="gl">${label}</div></div>`;
  return `<div class="card"><div class="row sp"><div><div class="eyebrow">${p.left>0?'Te quedan':'Superado en'}</div><div style="font-size:30px;font-weight:800;letter-spacing:-.5px;color:var(--food);line-height:1.1">${Math.abs(p.left)}<span class="sm mu" style="font-weight:650"> kcal</span></div></div>
    <span class="chip ${p.st==='ok'?'ok':p.st==='warn'?'warn':'bad'}">${p.st==='ok'?'Vas bien':p.st==='warn'?'Algo corto':'Vas por detrás'}</span></div>
    <div class="gauges">${g('bowl', p.k/p.T, 'Calorías', `${p.k}`, 'gfood', p.k>=p.T-100)}${g('shaker', p.prot/S.cfg.prot, 'Proteína', `${p.prot} g`, 'gprot', p.prot>=S.cfg.prot)}${g('glass', (n.water||0)/8, 'Agua', `${n.water||0}/8`, 'gwater', (n.water||0)>=8)}${g('jar', n.creat?1:0, 'Creatina', n.creat?'✓':'—', 'gcreat', !!n.creat)}</div>
    <p class="sm mt12">${esc(p.msg)}</p><div class="xs mu mt8">Toca el vaso para sumar agua y el bote para marcar la creatina. Macros: proteína ${S.cfg.prot} g · grasa ≈${fat} g · hidratos ≈${carbs} g.</div></div>`;
}
const SKILLS = [
  ['pull','Dominadas', st=>st.pulls, [8,10,12,15], 'reps'],
  ['dip','Fondos', st=>st.dips, [10,15,20,25], 'reps'],
  ['lsit','L-sit', st=>st.lsit, [10,20,30,45], 's'],
  ['pike','Pike', st=>st.pike, [8,12,15,20], 'reps'],
  ['fl','Front lever', st=>st.fl, [5,10,15,20], 's'],
  ['weight','Lastre', st=>st.lastre, [5,10,15,20], 'kg'],
];
function tierOf(v, lv){ const t = lv.filter(l=>v>=l).length; const prev = t ? lv[t-1] : 0, next = lv[t]; return {t, frac: next ? (v-prev)/(next-prev) : 1, next}; }
function skillBadges(st){
  return `<div class="card"><h3>Calistenia</h3><p class="xs mu mt4">Bronce, plata, oro y diamante. El anillo marca lo que te falta para el siguiente.</p><div class="badges">${SKILLS.map(([ic,n,f,lv,u])=>{ const v = f(st), T = tierOf(v, lv);
    return `<div class="badge ${T.t?'':'locked'}" data-act="badge" data-v="${n}|${v}|${T.next||''}|${u}"><div class="md">${medalSVG(ic, T.t, T.frac)}</div><div class="bn">${n}</div><div class="bs">${v||0} ${u}${T.next?` → ${T.next}`:' · ¡máx!'}</div></div>`; }).join('')}</div></div>`;
}
/* plan mensual */
let PLANV = 'week', PLANM = null;
function monthView(){
  const t = TODAY(); if (!PLANM) PLANM = t.slice(0,8)+'01';
  const first = PLANM, d0 = parse(first), mName0 = d0.toLocaleDateString('es-ES',{month:'long', year:'numeric'}).replace(' de ',' '), mName = mName0.charAt(0).toUpperCase()+mName0.slice(1);
  const start = mondayOf(first), lastDay = ymd(new Date(d0.getFullYear(), d0.getMonth()+1, 0, 12));
  const end = addDays(mondayOf(lastDay), 6);
  let cells = '';
  for (let d = start; d <= end; d = addDays(d,1)) {
    const inM = d.slice(0,7)===first.slice(0,7), its = dayItems(d).filter(i=>['str','pool','med'].includes(i.type) && !i.optional);
    const dots = its.map(i=>{ const s = sess(d,i.kind); const st = isDone(s) ? '' : (d<t || (s&&s.status==='cant')) ? ' miss' : ' h'; return `<span class="dot ${i.type}${st}"></span>`; }).join('');
    const n = nOf(d), kf = n ? Math.min(1, kcalOf(n)/(S.cfg.kcal||2900)) : 0;
    const full = its.length && its.every(i=>isDone(sess(d,i.kind)));
    cells += `<div class="mc ${inM?'':'out'} ${d===t?'today':''} ${full?'full':''}" data-act="mday" data-v="${d}"><div class="dn">${parse(d).getDate()}</div><div class="ics">${dots}</div>${kf?`<div class="kb"><i style="width:${kf*100}%"></i></div>`:''}</div>`;
  }
  return `<div class="card"><div class="row sp"><button class="btn sm" data-act="mm" data-v="-1">‹</button><h3>${mName}</h3><button class="btn sm" data-act="mm" data-v="1">›</button></div>
    <div class="mgrid">${DS.map(x=>`<div class="wd">${x}</div>`).join('')}${cells}</div>
    <div class="legend"><span><i class="dot str"></i>Fuerza</span><span><i class="dot pool"></i>Piscina</span><span><i class="dot med"></i>Movilidad</span><span><i class="dot h"></i>Pendiente</span><span><i class="dot miss"></i>No hecho</span><span><i style="display:inline-block;width:14px;height:4px;border-radius:4px;background:var(--food)"></i>Calorías</span></div></div>`;
}
function dayDetail(d){
  const its = dayItems(d).filter(i=>i.type!=='free'), n = nOf(d), c = (S.days[d]||{}).check, t = TODAY();
  modal(`<div class="eyebrow">Semana ${progWeek(d)}</div><h2 class="mt4">${fmtDL(d)}</h2>
    ${c&&c.saved?`<div class="sm mt8">Espalda <b>${c.back||'—'}</b> · dolor <b style="color:${painColor(c.pain)}">${c.pain}/10</b>${c.weight?` · ${c.weight} kg`:''}</div>`:''}
    <div class="mt8">${its.length ? its.map(it=>planRow(it,d)).join('') : '<div class="mu sm">Descanso</div>'}</div>
    ${n?`<div class="kv mt12"><span class="mu">Comida</span><b>${kcalOf(n)} kcal · ${protOf(n)} g prot</b></div>`:''}
    <div class="btns"><button class="btn" data-act="toweek" data-v="${d}">Ver semana</button>${d===t?'<button class="btn pri" data-act="tab" data-v="hoy">Ir a hoy</button>':''}</div>`);
}

boot();
