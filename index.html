<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wolfy">
<meta name="theme-color" content="#EAF5FC">
<title>Wolfy</title>
<link rel="manifest" href="manifest.webmanifest">
<script>window.__PWA=true;</script>
<link rel="apple-touch-icon" sizes="180x180" href="img/wolfy-icon-180.png">
<link rel="icon" type="image/png" href="img/wolfy-icon-512.png">
<style>
:root{
  --bg:#FBF6F3;--s1:#FFFFFF;--s2:#F5F9FC;--s3:#E9F2F8;--line:#E2ECF3;
  --tx:#013348;--mu:#5B7486;--mu2:#9BAFBE;
  --ac:#1586BF;--acf:#38B7EA;--acd:#38B7EA1F;--acl:#57B7E7;
  --med:#3C9A55;--medd:#B3E9A740;--sw:#0C9CC6;--swd:#59DCFB2B;
  --food:#E2705F;--foodd:#FEBAB140;--warn:#B88A1C;--warnd:#FEDC8955;--bad:#D64343;--badd:#D6434316;--ok:#3C9A55;--okd:#B3E9A740;
  --gold:#E9BB73;--pet:#1586BF;--petm:#57B7E7;--petl:#EAF6FC;--peach:#FEB8B0;--butter:#FEDEA1;--cal:#8B6FD0;--core:#E07088;
  --r:20px;--r2:14px;--sh:0 1px 2px rgba(1,51,72,.05),0 4px 14px rgba(1,51,72,.06);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);overflow-x:hidden}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Rounded","SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{background:var(--s2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--acf)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
#app{max-width:560px;margin:0 auto;padding:calc(var(--sat) + 14px) 16px calc(var(--sab) + 96px)}
h1{font-size:27px;font-weight:800;letter-spacing:-.5px;line-height:1.12}
h2{font-size:19px;font-weight:750;letter-spacing:-.3px}
h3{font-size:16px;font-weight:700}
.mu{color:var(--mu)}.sm{font-size:13px}.xs{font-size:11.5px}.b{font-weight:700}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px;box-shadow:var(--sh)}
.card.tight{padding:12px 14px}
.card.ac{border-color:#38B7EA44;background:linear-gradient(180deg,#38B7EA12,#fff 60%)}
.card.med{border-color:#3C9A5544}.card.sw{border-color:#0C9CC644}
.card.warn{border-color:#FEDC89AA;background:#FFF8EA}
.card.bad{border-color:#D6434366;background:#FFF1F0}
.eyebrow{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mu);font-weight:750}
.accent{color:var(--ac)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;padding:4px 9px;border-radius:99px;background:var(--s2);border:1px solid var(--line);color:var(--mu);white-space:nowrap}
.chip.ac{color:var(--ac);border-color:#38B7EA44;background:var(--acd)}
.chip.med{color:var(--med);border-color:#3C9A5533;background:var(--medd)}
.chip.sw{color:var(--sw);border-color:#0C9CC633;background:var(--swd)}
.chip.warn{color:var(--warn);border-color:#FEDC8988;background:var(--warnd)}
.chip.bad{color:var(--bad);border-color:#D6434333;background:var(--badd)}
.chip.ok{color:var(--ok);border-color:#3C9A5533;background:var(--okd)}
.chip.food{color:var(--food);border-color:#E2705F33;background:var(--foodd)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:15px;font-weight:700;font-size:15.5px;background:var(--s3);color:var(--tx);border:1px solid var(--line);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,#57B7E7,#38B7EA);color:#013348;font-weight:800;border-color:#38B7EA;box-shadow:0 4px 12px #38B7EA44}
.btn.medb{background:var(--med);color:#fff;border-color:var(--med)}
.btn.swb{background:var(--sw);color:#fff;border-color:var(--sw)}
.btn.foodb{background:var(--food);color:#fff;border-color:var(--food)}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:12px}
.btn.full{width:100%}
.btn[disabled]{opacity:.4}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#FFFFFFEE;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--sab)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mu2);font-size:10.5px;font-weight:650}
nav.tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--ac)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sync{font-size:11px;padding:4px 8px}
.item{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--s2);border:1px solid var(--line);margin-top:10px}
.item .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--s3)}
.item.str .ic{background:var(--acd)}.item.pool .ic{background:var(--swd)}.item.med .ic{background:var(--medd)}
.item.done{opacity:.8}.item.done .ic{background:var(--okd)}
.item .t{font-weight:700}
.item .grow{min-width:0}
.status{font-size:12px;font-weight:700}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.strip .d{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:7px 0 8px;text-align:center;cursor:pointer}
.strip .d.today{border-color:var(--acf);background:var(--acd)}
.strip .d .l{font-size:10.5px;color:var(--mu);font-weight:700}
.strip .d .n{font-size:14px;font-weight:750}
.strip .d .dots{display:flex;gap:3px;justify-content:center;margin-top:4px;min-height:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mu2);display:inline-block}
.dot.str{background:var(--acf)}.dot.pool{background:var(--sw)}.dot.med{background:var(--med)}
.dot.h{background:transparent;border:1.5px solid var(--mu2)}
.dot.str.h{background:transparent;border-color:var(--acf)}.dot.pool.h{background:transparent;border-color:var(--sw)}.dot.med.h{background:transparent;border-color:var(--med)}
.dot.miss{background:var(--bad)}
.seg{display:flex;background:var(--s3);border-radius:13px;padding:3px;gap:3px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;padding:8px 10px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--mu);white-space:nowrap}
.seg button.on{background:#fff;color:var(--ac);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.scale button{height:36px;border-radius:10px;background:var(--s2);border:1px solid var(--line);font-weight:700;font-size:13px}
.scale button.on{color:#fff;border-color:transparent}
.opt3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opt4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.opt3 button,.opt4 button{min-height:44px;border-radius:12px;background:var(--s2);border:1px solid var(--line);font-weight:700;font-size:14px}
.opt3 button.on,.opt4 button.on{background:var(--acd);border-color:var(--acf);color:var(--ac)}
label.f{display:block;font-size:12.5px;color:var(--mu);font-weight:650;margin:12px 0 6px}
#runner{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
#runner.on{display:block}
#runner .in{max-width:560px;margin:0 auto;padding:calc(var(--sat) + 10px) 14px calc(var(--sab) + 120px)}
.rhead{position:sticky;top:0;z-index:5;background:#FBF6F3F2;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin:0 -14px;padding:8px 14px 10px;border-bottom:1px solid var(--line)}
.block{margin-top:16px}
.block .bl{font-size:12px;font-weight:750;letter-spacing:1px;color:var(--mu);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.block .bl:after{content:"";flex:1;height:1px;background:var(--line)}
.ex{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:8px;box-shadow:var(--sh)}
.ex.medx{border-left:4px solid var(--med)}
.ex.donex{border-color:#3C9A5566;background:#FAFEF9}
.ex .nm{font-weight:750;font-size:16px;line-height:1.25}
.presc{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sug{margin-top:10px;font-size:13px;padding:9px 11px;border-radius:12px;background:var(--s2);border:1px solid var(--line)}
.sug.up{border-color:#38B7EA44;background:var(--acd);color:#013348}
.sug.hold{border-color:#FEDC8999;background:#FFF8EA}
.sets{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:26px 1fr 1fr 62px 46px;gap:6px;align-items:center}
.set.two{grid-template-columns:26px 1fr 1fr 46px}
.set.one{grid-template-columns:26px 1fr 46px}
.set.timed1{grid-template-columns:26px 1fr 46px 46px}.set.timed2{grid-template-columns:26px 1fr 1fr 46px 46px}
.set .no{font-size:13px;color:var(--mu);font-weight:750;text-align:center}
.set input,.set select{padding:9px 6px;text-align:center;font-size:16px;border-radius:10px;min-width:0;background:#fff}
.set select{background-position:calc(100% - 10px) 55%,calc(100% - 5px) 55%;padding-right:14px}
.set .ck{height:42px;border-radius:11px;background:var(--s3);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;color:var(--mu)}
.set .ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.set .ck.play{background:var(--acd);border-color:#38B7EA55;color:var(--ac);font-size:16px}
.sethead{display:grid;grid-template-columns:26px 1fr 1fr 62px 46px;gap:6px;font-size:10.5px;color:var(--mu2);font-weight:750;text-transform:uppercase;letter-spacing:.6px;text-align:center}
.sethead.two{grid-template-columns:26px 1fr 1fr 46px}.sethead.one{grid-template-columns:26px 1fr 46px}
.sethead.timed1{grid-template-columns:26px 1fr 46px 46px}.sethead.timed2{grid-template-columns:26px 1fr 1fr 46px 46px}
details.tips{margin-top:10px}
details.tips summary{font-size:13px;color:var(--mu);font-weight:700;list-style:none;cursor:pointer}
details.tips summary::-webkit-details-marker{display:none}
details.tips ul{margin:8px 0 0 18px;font-size:13.5px}
details.tips li{margin-top:3px}
.lum{margin-top:8px;font-size:13px;color:#2E7A42;background:var(--medd);border-radius:12px;padding:8px 10px}
.pair{font-size:12px;color:var(--med);margin-top:6px;font-weight:650}
.restbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:#FFFFFFF5;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 14px calc(var(--sab) + 10px);display:none;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.restbar .in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.timer{font-size:26px;font-weight:800;min-width:76px;letter-spacing:-.5px;color:var(--ac)}
.timer.go{color:var(--ok)}
.painsel{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px}
.painsel select{width:auto;padding:7px 26px 7px 10px;font-size:14px}
#modal{position:fixed;inset:0;z-index:60;background:#01334866;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .sheet{background:var(--s1);border-radius:24px 24px 0 0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:18px 16px calc(var(--sab) + 18px)}
#modal .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.bar{height:8px;border-radius:9px;background:var(--s3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acf);border-radius:9px}
.bar.sw i{background:var(--sw)}.bar.med i{background:var(--med)}.bar.food i{background:var(--food)}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.list li{margin:6px 0 0 18px;font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{color:var(--mu);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:12px;background:var(--s3);border:1px solid var(--line);font-size:20px;font-weight:750}
.stepper .v{min-width:44px;text-align:center;font-weight:800;font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 84px);z-index:80;background:var(--tx);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:650;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.empty{padding:22px 10px;text-align:center;color:var(--mu);font-size:14px}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.swimset{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.swimset:last-child{border-bottom:0}
.swimset .ck{width:30px;height:30px;border-radius:9px;flex:none;background:var(--s3);border:1px solid var(--line);display:grid;place-items:center;color:var(--mu)}
.swimset .ck.on{background:var(--sw);color:#fff;border-color:var(--sw)}
.tag{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:2px 6px;border-radius:6px}
.tag.med{background:var(--medd);color:var(--med)}.tag.fund{background:var(--acd);color:var(--ac)}.tag.acc{background:var(--s3);color:var(--mu)}.tag.cal{background:#D2C3EB55;color:var(--cal)}.tag.core{background:#E0708818;color:var(--core)}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}
a{color:var(--ac)}
/* línea temporal */
.tl{position:relative;margin-top:14px}
.tl .te{display:grid;grid-template-columns:44px 18px minmax(0,1fr);align-items:start}
.tl .tm{font-size:13px;font-weight:800;color:var(--ac);padding-top:12px;text-align:right;padding-right:6px}
.tl .ln{position:relative;align-self:stretch}
.tl .ln:before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line)}
.tl .te:first-child .ln:before{top:16px}.tl .te:last-child .ln:before{bottom:calc(100% - 16px)}
.tl .ln i{position:absolute;left:3px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--mu2);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.tl .ln i.ac{background:var(--acf)}.tl .ln i.med{background:var(--med)}.tl .ln i.sw{background:var(--sw)}.tl .ln i.food{background:var(--food)}.tl .ln i.ok{background:var(--ok)}
.tl .bd{padding:4px 0 10px 4px;min-width:0}
.tl .item{padding:12px;margin-top:0}
.tl .item .ic{width:38px;height:38px;font-size:18px}
.tl .stepper button{width:36px;height:36px}.tl .stepper .v{min-width:34px;font-size:16px}
.meal{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--s2);border:1px solid var(--line);cursor:pointer}
.meal .mt{font-weight:700;font-size:14.5px}
.meal .bar{height:6px}.meal .bar i{background:var(--food)}
.meal.done{border-color:#3C9A5555;background:#F4FBF2}
.prev{margin-top:10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.prev .pb{font-size:10.5px;font-weight:800;letter-spacing:1px;color:var(--mu2);text-transform:uppercase;margin-top:6px}
.prev .pe{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:2px 0}
.prev .pe .nm2{display:flex;align-items:center;gap:7px;min-width:0;flex:1}
.prev .pe .nm2 span.t2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prev .pe .dd{width:8px;height:8px;border-radius:50%;flex:none;background:var(--acf)}
.prev .pe .dd.med{background:var(--med)}
.prev .pe b{font-weight:700;color:var(--mu);white-space:nowrap;font-size:12.5px}
/* comida */
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1}
.fitem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.fitem:last-child{border-bottom:0}
.fitem .x{width:30px;height:30px;border-radius:9px;background:var(--s3);color:var(--mu);font-size:15px}
.mealcard{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:10px;box-shadow:var(--sh)}
.mealcard.now{border-color:var(--food);box-shadow:0 0 0 3px #FEBAB140}
.frow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.frow .add{width:38px;height:38px;border-radius:12px;background:var(--food);color:#fff;font-size:22px;font-weight:800;flex:none}
.qty{display:flex;gap:6px;margin-top:10px}
.qty button{flex:1;height:38px;border-radius:11px;background:var(--s2);border:1px solid var(--line);font-weight:750;font-size:14px}
.qty button.on{background:var(--foodd);border-color:var(--food);color:var(--food)}
/* cronómetro */
#tmr{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--sat) + 20px) 24px calc(var(--sab) + 24px);text-align:center}
#tmr.on{display:flex}
#tmr.work{background:#E6F4FB}
#tmr.flash{background:#E8F8E4}
#tmr .lbl{font-size:24px;font-weight:800;letter-spacing:-.3px}
#tmr .sub2{color:var(--mu);font-size:14px;margin-top:6px}
#tmr .clock{position:relative;width:260px;height:260px;margin:26px 0}
#tmr .clock svg{width:100%;height:100%;transform:rotate(-90deg)}
#tmr .clock .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:88px;font-weight:800;letter-spacing:-3px;color:var(--tx)}
#tmr .tb{display:flex;gap:10px;width:100%;max-width:360px}
#tmr .tb .btn{flex:1}
.rprog{height:6px;border-radius:9px;background:var(--s3);overflow:hidden;margin-top:8px}
.rprog i{display:block;height:100%;background:var(--acf)}
/* ===== mascota ===== */
.hero{position:relative;border-radius:24px;overflow:hidden;margin-top:12px;height:250px;border:1px solid var(--line);box-shadow:var(--sh);background:#EEF7FC}
.hero .scene{position:absolute;inset:0;width:100%;height:100%}
.hero .petwrap{position:absolute;left:50%;bottom:6px;width:190px;height:209px;transform:translateX(-50%);cursor:pointer}
.hero .petwrap svg{width:100%;height:100%;overflow:visible}
.hero .hud{position:absolute;left:12px;top:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.hero .nm{background:#FFFFFFE6;border-radius:14px;padding:6px 10px;box-shadow:0 1px 4px rgba(0,0,0,.08);pointer-events:auto}
.hero .nm b{font-size:15px;color:var(--ac)}
.hero .lvbar{height:6px;border-radius:9px;background:#00000014;overflow:hidden;margin-top:4px;width:110px}
.hero .lvbar i{display:block;height:100%;background:var(--acf);border-radius:9px}
.bubbles{position:absolute;right:10px;top:58px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.bubbles.left{right:auto;left:10px;align-items:flex-start}
.bub{pointer-events:auto;display:flex;align-items:center;gap:6px;background:#fff;border-radius:16px;padding:6px 10px 6px 6px;box-shadow:0 3px 10px rgba(28,34,48,.13);font-size:12.5px;font-weight:750;animation:pop .45s cubic-bezier(.2,1.6,.4,1) both, floaty 3.2s ease-in-out .5s infinite;cursor:pointer;max-width:150px}
.bub .bi{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;flex:none}
.bub .bi svg{width:20px;height:20px}
.bub:nth-child(2){animation-delay:.12s,.8s}.bub:nth-child(3){animation-delay:.24s,1.1s}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.pet .tail{transform-origin:148px 182px;animation:wag 1.4s ease-in-out infinite}
.pet.happy .tail,.pet.proud .tail{animation-duration:.55s}
.pet.sleepy .tail{animation:none}
.pet .bodyg{transform-origin:100px 205px;animation:breathe 3.4s ease-in-out infinite}
.pet .headg{transform-origin:100px 120px;animation:headbob 3.4s ease-in-out infinite}
.pet .eyeo{transform-origin:100px 92px;animation:blink 5.2s infinite}
.pet .earL{transform-origin:66px 58px;animation:twitchL 7s ease-in-out infinite}
.pet .earR{transform-origin:134px 58px;animation:twitchR 9s ease-in-out infinite}
.pet.jump{animation:jump .7s ease}
.pet.sleepy .headg{animation:nod 4s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.025)}}
@keyframes headbob{0%,100%{transform:translateY(0)}50%{transform:translateY(1.5px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes twitchL{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-9deg)}96%{transform:rotate(3deg)}}
@keyframes twitchR{0%,85%,100%{transform:rotate(0)}88%{transform:rotate(9deg)}91%{transform:rotate(-3deg)}}
@keyframes jump{0%{transform:translateY(0)}30%{transform:translateY(-26px) scale(1.03)}55%{transform:translateY(0) scale(1.04,.96)}75%{transform:translateY(-8px)}100%{transform:translateY(0)}}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg) translateY(2px)}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.scene .waves{animation:wave 3s linear infinite}
.scene .zz{animation:floaty 2.4s ease-in-out infinite}
/* gauges de nutrición */
.gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.gauge{background:var(--s2);border:1px solid var(--line);border-radius:16px;padding:10px 6px 8px;text-align:center;cursor:pointer}
.gauge svg{width:44px;height:52px;display:block;margin:0 auto}
.gauge .gl{font-size:11px;font-weight:750;color:var(--mu);margin-top:4px}
.gauge .gv{font-size:13px;font-weight:800}
.gauge.done{border-color:#3C9A5555;background:#F1FAEE}
/* logros y armario */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.badge{text-align:center;cursor:pointer}
.badge .md{position:relative;width:84px;height:84px;margin:0 auto}
.badge .md svg{width:100%;height:100%}
.badge .bn{font-size:12px;font-weight:750;margin-top:4px;line-height:1.2}
.badge .bs{font-size:11px;color:var(--mu)}
.badge.locked .md{filter:grayscale(1);opacity:.45}
.wardrobe{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.wi{background:var(--s2);border:1.5px solid var(--line);border-radius:16px;padding:8px 4px;text-align:center;cursor:pointer;position:relative}
.wi svg{width:46px;height:46px}
.wi .wn{font-size:10.5px;font-weight:700;line-height:1.15;margin-top:2px}
.wi.on{border-color:var(--acf);background:var(--acd)}
.wi.locked{opacity:.5}
.wi.locked svg{filter:grayscale(1)}
.wi .lk{position:absolute;top:4px;right:6px;font-size:11px}
.dbs{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:4px;scrollbar-width:none}
.dbs::-webkit-scrollbar{display:none}
.db{flex:none;width:74px;background:var(--s2);border:1.5px solid var(--line);border-radius:16px;padding:8px 4px;text-align:center;cursor:pointer}
.db svg{width:56px;height:30px}
.db.on{border-color:var(--acf);background:var(--acd)}
.db.locked{opacity:.45}
.db .dn{font-size:10.5px;font-weight:750;margin-top:2px}
.meter{display:flex;align-items:center;gap:10px;margin-top:10px}
.meter .bar{flex:1;height:12px}
.meter .bar i{background:linear-gradient(90deg,#A2D8FB,#38B7EA)}
.celebrate{position:relative;text-align:center;overflow:hidden}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(420px) rotate(540deg);opacity:0}}
/* calendario mensual */
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.mgrid .wd{font-size:10.5px;font-weight:800;color:var(--mu2);text-align:center;padding-bottom:2px}
.mc{min-height:62px;border-radius:12px;background:var(--s1);border:1px solid var(--line);padding:5px 4px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.mc.out{opacity:.35}
.mc.today{border-color:var(--acf);box-shadow:0 0 0 2px #38B7EA33}
.mc .dn{font-size:12.5px;font-weight:800}
.mc .ics{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.mc .ics .dot{width:8px;height:8px}
.mc .kb{width:80%;height:4px;border-radius:4px;background:var(--s3);overflow:hidden;margin-top:auto}
.mc .kb i{display:block;height:100%;background:var(--food)}
.mc.full{background:#F1FAEE}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--mu);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* ===== FitPup ===== */
.hero.fp{height:auto;aspect-ratio:1.4/1;background:#EEF7FC}
.hero.fp .scene{object-fit:cover;object-position:center 40%;animation:kb 18s ease-in-out infinite alternate;cursor:pointer}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.05)}}
.hero .nm{display:flex;gap:8px;align-items:center;padding:5px 10px 5px 5px;border-radius:16px}
.hero .nm .av{width:44px;height:44px;border-radius:12px;object-fit:cover;object-position:top;background:#EEF7FC;animation:breathe 3.4s ease-in-out infinite}
.hero .nm b{color:var(--pet)}
.hero .lvbar i{background:var(--pet)}
.hero .scn{background:#FFFFFFD9;color:var(--pet);font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;letter-spacing:.3px}
.hero .bubbles{top:auto;bottom:10px}
.hearts{position:absolute;inset:0;pointer-events:none}
.card{position:relative}
.hearts i{position:absolute;bottom:30%;font-style:normal;font-size:22px;animation:rise 1.5s ease-out forwards}
@keyframes rise{from{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}to{transform:translateY(-120px) scale(1.2);opacity:0}}
.fpcard{background:linear-gradient(180deg,#EAF6FC,#fff 70%);border-color:#D3ECF8}
.avbig{width:220px;max-width:70%;display:block;margin:10px auto 6px;border-radius:24px;animation:breathe 3.4s ease-in-out infinite;cursor:pointer}
.btn.petb{background:var(--pet);color:#fff;border-color:var(--acf);box-shadow:0 4px 12px #38B7EA44}
.chip.pet{color:var(--pet);border-color:#38B7EA44;background:var(--petl)}
.bar.pet i{background:linear-gradient(90deg,var(--petm),var(--pet))}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px;align-items:end}
.stg{text-align:center}
.stg img{width:100%;border-radius:12px;display:block}
.stg .sn{font-size:10.5px;font-weight:800;color:var(--pet);margin-top:3px}
.stg.locked img{filter:grayscale(1) brightness(1.05);opacity:.45}
.stg.locked .sn{color:var(--mu2)}
.stg.cur img{box-shadow:0 0 0 3px var(--acf)}
.rw{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rw:last-child{border-bottom:0}
.rw>img{width:54px;height:54px;object-fit:contain;flex:none}
.dotsw{display:flex;gap:6px;margin:6px 0 4px}
.dotsw i{width:26px;height:26px;border-radius:50%;background:var(--petl);border:2px solid #CDE8F6;display:grid;place-items:center;font-style:normal;font-size:13px;color:#fff;font-weight:800}
.dotsw i.on{background:var(--pet);border-color:var(--acf)}
.track{display:flex;align-items:center;margin:6px 0 4px}
.track span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--petl);color:#BFE0F2;font-size:15px;flex:none}
.track span.on{background:var(--butter);color:#fff}
.track i{flex:1;height:4px;background:#D3ECF8;margin:0 4px;border-radius:4px}
.wi img{width:100%;max-width:70px;aspect-ratio:1;object-fit:contain;display:block;margin:0 auto}
.wardrobe{grid-template-columns:repeat(3,1fr)}
.db{width:90px}
.db img{width:72px;height:44px;object-fit:contain;display:block;margin:0 auto}
.db.on{border-color:var(--acf);background:var(--petl)}
.looks{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:4px;scrollbar-width:none}
.looks::-webkit-scrollbar{display:none}
.lk2{flex:none;width:112px;background:var(--s2);border:1.5px solid var(--line);border-radius:16px;padding:6px;text-align:center;cursor:pointer}
.lk2 img{width:100%;border-radius:12px;display:block}
.lk2.on{border-color:var(--acf);background:var(--petl)}
.lk2.locked img{filter:grayscale(1);opacity:.45}
.lk2 .wn{font-size:11.5px;font-weight:800;margin-top:4px}
.celimg{display:block;width:200px;max-width:70%;margin:0 auto;border-radius:22px;animation:breathe 3s ease-in-out infinite}

.hero.fp .bubbles{top:10px;bottom:auto;right:8px;gap:6px}
.hero.fp .bub{flex-direction:column;gap:2px;padding:6px 4px 5px;border-radius:16px;width:62px;max-width:none;text-align:center;font-size:10px;line-height:1.1}
.hero.fp .bub .bi{width:34px;height:34px;border-radius:12px}
.hero.fp .bub .bi svg{width:24px;height:24px}
.hero.fp .hud{right:auto;max-width:48%}
.hero.fp .scn{position:absolute;left:12px;bottom:10px;top:auto}
.hero .nm .av{width:36px;height:36px}
.hero.fp .nm{padding:4px 8px 4px 4px}
.hero.fp .nm b{font-size:14px}
.hero.fp .lvbar{width:84px}

/* ===== FitPup v5 · mascota animada por capas ===== */
.btn.petb{background:linear-gradient(180deg,#57B7E7,#38B7EA);color:#013348;border-color:#38B7EA}
h1,h2,h3{color:var(--tx)}
.hero.fp{background:#EAF6FC;aspect-ratio:1487/1058}
.hero.fp .scene{animation:none}
.pupat{position:absolute;transform:translateX(-50%);cursor:pointer;z-index:1;display:flex;align-items:flex-end}
.pupat .pup{height:100%}
.pup{position:relative;height:100%;filter:drop-shadow(0 6px 6px rgba(1,51,72,.16))}
.pup>.tl,.pup .bdi{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;-webkit-user-select:none;user-select:none}
.pup>.tl{animation:wag 1.25s ease-in-out infinite}
.pup .bd{position:absolute;inset:0;transform-origin:50% 100%;animation:breathe2 3.6s ease-in-out infinite}
.pup .eyes{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.pup .eo .e1{transform-box:fill-box;transform-origin:50% 50%;transition:transform .07s}
.pup.blink .eo .e1{transform:scaleY(.08)}
.pup .ec,.pup .es{display:none}
.pup.m-happy .eo,.pup.m-proud .eo,.pup.joy .eo,.pup.m-sleepy .eo{display:none}
.pup.m-happy .ec,.pup.m-proud .ec,.pup.joy .ec{display:inline}
.pup.m-sleepy:not(.joy) .es{display:inline}
.pup.m-sleepy>.tl{animation-duration:3.2s}
.pup.m-hungry>.tl,.pup.m-concerned>.tl{animation-duration:2.4s}
.pup.m-proud>.tl,.pup.joy>.tl{animation-duration:.5s}
.pup.joy{animation:hop .7s cubic-bezier(.3,1.6,.5,1) 2;transform-origin:50% 100%}
.pup .fx{position:absolute;pointer-events:none}
.pup .fx.md{transform-origin:50% 0;animation:swing 3.6s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
@keyframes breathe2{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.022)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-9%) scale(.98,1.03)}70%{transform:translateY(0) scale(1.04,.96)}}
@keyframes swing{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.avbig2{width:200px;height:250px;margin:6px auto 4px;display:flex;justify-content:center;cursor:pointer}
.namefig{height:230px;display:flex;justify-content:center;background:radial-gradient(circle at 50% 70%,#D9EFFB,#EAF6FC 60%,transparent 72%);border-radius:18px}
.hero .nm .av{object-fit:cover;object-position:50% 8%;background:#EAF6FC}
.stg img{background:#EAF6FC;aspect-ratio:3/4;object-fit:contain;object-position:bottom}
.celimg{object-fit:contain;background:#EAF6FC}
@media (prefers-reduced-motion:reduce){.pup>.tl,.pup .bd,.pup .fx.md{animation:none}}
.hero.fp .scn{left:auto;right:10px;bottom:10px;z-index:2}
.hero.fp .hud,.hero.fp .bubbles{z-index:2}

.hoytop{padding-top:4px;min-height:0}.hoytop .mu{font-weight:650}

</style>

function muscleScore(){
  const ws = Object.keys(S.days).sort().filter(d=>S.days[d].check && S.days[d].check.weight).map(d=>[d, S.days[d].check.weight]);
  let wf = null, wInfo = '';
  if (ws.length >= 3) { const d0 = ws[0][0], first = ws.filter(([d])=>diffDays(d0,d)<7).map(x=>x[1]), last7 = ws.filter(([d])=>diffDays(d,TODAY())<7).map(x=>x[1]);
    if (last7.length) { const b = first.reduce((a,c)=>a+c,0)/first.length, c = last7.reduce((a,v)=>a+v,0)/last7.length, g = S.cfg.pet.goalW || 79;
      wf = Math.max(0, Math.min(1, (c-b)/Math.max(1, g-b))); wInfo = `${r1(b)} → ${r1(c)} kg (meta ${g})`; } }
  const rs = [];
  KEY_LIFTS.forEach(id => { const h = history(id).slice().reverse(); if (h.length < 2) return; const e = EX[id];
    const sc = x => Math.max(...x.sets.map(s => e1rm(e.t==='bw' ? (S.cfg.bw||71.5)+(s.w||0) : (s.w||0), s.r||0)));
    const a = sc(h[0]), b = Math.max(...h.slice(-3).map(sc)); if (a > 0) rs.push(b/a - 1); });
  const avg = rs.length ? rs.reduce((x,y)=>x+y,0)/rs.length : 0;
  const sf = rs.length ? Math.max(0, Math.min(1, avg/0.5)) : null;
  const m = wf!=null && sf!=null ? (wf+sf)/2 : (wf ?? sf ?? 0);
  return {m, wf, sf, sfPct: rs.length>=3 ? Math.round(avg*100) : 0, nLifts: rs.length, wInfo, sInfo: rs.length ? `+${Math.round(avg*100)}% de media en ${rs.length} ejercicios` : ''};
}

}

  prot:130, kcal:2900, fat:90, bw:71.5, weekPlans:{}, skips:{}, milestones:{}, foods:[], v:2, pet:{name:'Wolfy', equip:{}, lastLevel:1, lastStage:0, seen:[], goalW:79},

const wq = {}; // cola de escrituras por documento
function queueWrite(path, getData){
  saveLocal();
  if (!DB) return;
  const q = wq[path] || (wq[path] = {t:null, busy:false, dirty:false});
  clearTimeout(q.t);
  q.t = setTimeout(() => flush(path, getData), 700);
}
async function flush(path, getData){
  const q = wq[path];
  if (q.busy) { q.dirty = true; return; }
  q.busy = true; q.dirty = false;
  try { await DB.doc(path).set(clone(getData())); setSync('cloud'); }
  catch(e){ if (e && e.code === 'unavailable') { await new Promise(r=>setTimeout(r, 1500+Math.random()*1500)); try{ await DB.doc(path).set(clone(getData())); }catch(_){ setSync('error'); } } else setSync('error'); }
  q.busy = false;
  if (q.dirty) flush(path, getData);
}
function saveCfg(){ S.cfg.updatedAt = Date.now(); queueWrite('config/settings', () => S.cfg); }
function day(d){ return S.days[d] || (S.days[d] = {date:d, updatedAt:0, sessions:{}}); }
function saveDay(d){ const o = day(d); o.updatedAt = Date.now(); queueWrite('days/'+d, () => S.days[d]); }

function setSync(s){ SYNC = s; const el = $('#syncchip'); if (el) el.outerHTML = syncChip(); }

  const m = {cloud:['ok','☁︎ Guardado en tu cuenta'], local: window.__PWA ? ['ok','📱 Guardado en el iPhone'] : ['warn','Solo en este dispositivo'], connecting:['','Conectando…'], error:['bad','Sin conexión · guardado local']}[SYNC];

function withTimeout(p, ms){ return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}), ms))]); }
async function initCloud(){
  if (!window.claude || typeof window.claude.use !== 'function') { setSync('local'); return; }
  setSync('connecting');
  let db = null;
  try { db = await withTimeout(window.claude.use('db'), 11000); } catch(e){ db = null; }
  if (!db) { setSync('local'); return; }
  try {
    const [c, q] = await withTimeout(Promise.all([db.doc('config/settings').get(), db.collection('days').get()]), 15000);
    DB = db;
    const push = [];
    if (c.exists) { const cc = c.data(); if ((cc.updatedAt||0) >= (S.cfg.updatedAt||0)) S.cfg = Object.assign(defCfg(), clone(cc)); else push.push('cfg'); }
    else if (S.cfg.updatedAt) push.push('cfg');
    const seen = new Set();
    q.docs.forEach(ds => { const dd = ds.data(); if (!dd) return; seen.add(ds.id);
      const loc = S.days[ds.id];
      if (!loc || (dd.updatedAt||0) >= (loc.updatedAt||0)) S.days[ds.id] = clone(dd); else push.push(ds.id); });
    Object.keys(S.days).forEach(k => { if (!seen.has(k) && S.days[k].updatedAt) push.push(k); });
    migrate(); saveLocal(); setSync('cloud'); render();
    for (const k of push) { if (k==='cfg') await DB.doc('config/settings').set(clone(S.cfg)); else await DB.doc('days/'+k).set(clone(S.days[k])); }
  } catch(e){ DB = null; setSync(e && e.code==='timeout' ? 'error' : 'local'); }
}

/* ================== LÓGICA DEL PROGRAMA ================== */
function progWeek(d){ return Math.floor(diffDays(mondayOf(S.cfg.start), mondayOf(d))/7) + 1 - (S.cfg.repeats||0); }
function phaseOf(w){
  if (w < 1) return 'PRE';
  if (w <= 2) return 'F1'; if (w <= 4) return 'F2'; if (w <= 6) return 'F3'; if (w <= 8) return 'F4';
  if (!S.cfg.alta) return 'F4';
  const b = w - (S.cfg.altaWeek||9) + 1;
  if (b < 1) return 'F4';
  return (b % 5 === 0) ? 'DL' : 'B3';
}
function isChangeWeek(w){ const p = phaseOf(w), q = phaseOf(w-1); return w > 1 && p !== q && !(p==='B3' && q==='DL'); }
function poolFor(w, ph){
  if (ph==='DL') return 'P3';
  if (w<=1) return 'P1'; if (w<=3) return 'P2'; if (w<=5) return 'P3'; if (w<=7) return 'P4'; if (w<=9) return 'P5'; return 'P6';
}
function weekSchedule(m){
  const base = {A:m, pool:addDays(m,1), B:addDays(m,2), C:addDays(m,4)};
  return Object.assign(base, S.cfg.weekPlans[m] || {});
}
function walkTarget(d){
  const w = progWeek(d), ph = phaseOf(w);
  if (ph==='F1'){ const idx = (w-1)*7 + dow(d); return {min: Math.min(30, 15 + 5*Math.floor(idx/3.5)), txt:''}; }
  if (ph==='F2') return {min:25, txt:'25-35 min a ritmo moderado'};
  if (ph==='F3') return {min:30, txt:'30-40 min'};
  if (ph==='F4') return {min:30, txt:'30 min'};
  return {min:0, txt:'opcional'};
}
const sess = (d,k) => (S.days[d] && S.days[d].sessions && S.days[d].sessions[k]) || null;
const isDone = s => s && (s.status==='done' || s.status==='partial');

function dayItems(d){
  const w = progWeek(d), ph = phaseOf(w); if (ph==='PRE') return [];
  const m = mondayOf(d), plan = weekSchedule(m), wd = dow(d), items = [];
  const skips = S.cfg.skips[m] || [];
  ['A','B','C'].forEach(k => {
    const s = sess(d,k);
    if (plan[k]===d && !skips.includes(k)) items.push({type:'str', kind:k});
    else if (s && (isDone(s) || s.status==='progress')) items.push({type:'str', kind:k});
  });
  const strToday = items.some(i=>i.type==='str');
  if ((plan.pool===d && !skips.includes('pool')) || isDone(sess(d,'pool'))) items.push({type:'pool', kind:'pool', code: poolFor(w,ph)});
  if (ph==='F1' && !strToday && wd<=4) items.push({type:'med', kind:'med'});
  if (ph==='F1' && wd<=5) items.push({type:'walk', kind:'walk'});
  else if (['F2','F3','F4'].includes(ph) && wd===3) items.push({type:'walk', kind:'walk'});
  if (w>=6 && wd===3 && ph!=='DL') items.push({type:'pool', kind:'opt', code:'OPT', optional:true});
  if (!items.length || (wd>=5 && !items.some(i=>i.type!=='walk'))) items.push({type:'free', kind:'free'});
  return items;
}

/* sesiones */
function mkItem(id, ph, setsOvr){
  const e = EX[id], P = PH[ph];
  if (e.t==='med') {
    const rir = ph==='F3' ? '3-4' : (ph==='F1' ? '' : '2-3');
    return {id, sets: setsOvr || e.sets, r: e.r, rir, rest: 0, med:true};
  }
  let rir = P.rir;
  if (ph==='B3') rir = (e.cat==='fund' || e.cat==='cal') ? '2' : '1-2';
  const r = (RANGE_OVR[ph] && RANGE_OVR[ph][id]) || e.r;
  return {id, sets: setsOvr || P.sets, r, rir, rest: e.rest || 75};
}
function buildSession(kind, w, opt={}){
  const ph = phaseOf(w), P = PH[ph], blocks = [];
  const L = 'ABCDEFGHIJ';
  if (kind==='med') {
    blocks.push({label:'Rutina de movilidad · plan médico', warm:true, items: [...PH.F1.warm, ...PH.F1.med].map(id=>mkItem(id,'F1'))});
    return {kind, w, ph, title:'Rutina de movilidad', sub:'Plan médico · fase 1', blocks, est: 22, note:'20-30 min. Se acepta molestia hasta 3/10 con las condiciones del semáforo.'};
  }
  const express = opt.variant==='express';
  if (['F1','F2','F3','F4'].includes(ph)) {
    const warmIds = ph==='F1' ? P.warm : ['m_gatocam','m_bascul'];
    blocks.push({label:'Calentamiento', warm:true, note: P.warmNote, items: warmIds.map(id=>Object.assign(mkItem(id, ph==='F1'?'F1':ph, ph==='F1'?null:1),{warm: ph!=='F1'}))});
    let ws = (express ? EXPRESS[kind] : W[kind][ph]).slice();
    const ms = P.med.slice();
    let i = 0;
    while (ws.length || ms.length) {
      const items = [];
      if (ws.length && ms.length) { items.push(mkItem(ws.shift(),ph)); items.push(mkItem(ms.shift(),ph)); }
      else if (ws.length) { items.push(mkItem(ws.shift(),ph)); if (ws.length) items.push(mkItem(ws.shift(),ph)); }
      else { items.push(mkItem(ms.shift(),ph)); }
      blocks.push({label: 'Bloque '+L[i++], items});
    }
  } else { // B3 / DL
    blocks.push({label:'Calentamiento · seguro lumbar', warm:true, note: P.warmNote, items: P.warm.map(id=>Object.assign(mkItem(id, ph, 1),{warm:true}))});
    const src = express ? B3[kind].slice(0,3) : B3[kind];
    src.forEach((ids,i) => blocks.push({label:'Bloque '+L[i], items: ids.map(id=>mkItem(id, ph))}));
  }
  if (opt.fuse) {
    blocks.push({label:'Extra · lo esencial de '+W[opt.fuse].name, note:'Recuperas lo más importante de la sesión que te saltaste.', items: EXPRESS[opt.fuse].slice(0,2).map(id=>mkItem(id, ph==='DL'?'DL':ph, 2))});
  }
  return {kind, w, ph, title: W[kind].name, sub: W[kind].sub, blocks, est: estimate(blocks), express};
}
function estimate(blocks){
  let sec = 0;
  blocks.forEach(b => {
    const rounds = Math.max(...b.items.map(i=>i.sets));
    let per = 0, rest = 0;
    b.items.forEach(it => { const e = EX[it.id]; const both = e.per ? 1.8 : 1;
      per += (e.unit==='s' ? it.r[1] : e.unit==='m' ? 30 : 35) * both; rest = Math.max(rest, it.med ? 20 : it.rest); });
    sec += rounds * (per + rest);
  });
  return Math.round(sec/60 + 6);
}

/* ================== HISTORIAL Y PROGRESIÓN ================== */
function history(exId, beforeDate){
  const out = [];
  Object.keys(S.days).sort().reverse().forEach(d => {
    if (beforeDate && d >= beforeDate) return;
    const ss = S.days[d].sessions || {};
    Object.values(ss).forEach(s => {
      const x = s.ex && s.ex[exId]; if (!x) return;
      const ok = (x.sets||[]).filter(t => t && t.ok);
      if (ok.length) out.push({date:d, sets: ok, pain: x.pain, ph: s.ph, all: x.sets});
    });
  });
  return out;
}
const e1rm = (w,r) => w>0 && r>0 ? w*(1+r/30) : 0;
function incW(e, w){
  const inc = e.inc;
  if (inc==='barra') return {w: r1(w+2.5), t:'+2,5 kg'};
  if (inc==='polea') return {w: null, t:'1 placa más'};
  if (inc==='kb') return {w: r1(w+4), t:'la siguiente kettlebell / +4 kg'};
  return {w: r1(w+2), t:'+2 kg (o el siguiente salto de discos)'};
}
function morningAfter(d){ const n = S.days[addDays(d,1)]; return n && n.check ? n.check.back : null; }
function suggest(it, ctx){
  const e = EX[it.id], h = history(it.id, ctx.date);
  const rng = it.r[0]===it.r[1] ? it.r[0] : it.r[0]+'-'+it.r[1];
  const unit = e.unit==='s' ? ' s' : e.unit==='m' ? ' m' : '';
  if (e.t==='med') {
    if (!h.length) return {cls:'', txt: e.wt ? 'Empieza con un peso ligero y técnica limpia.' : 'Céntrate en la técnica y en el control.'};
    const last = h[0], minR = Math.min(...last.sets.map(s=>s.r||0)), topW = Math.max(0,...last.sets.map(s=>s.w||0));
    const two = h.slice(0,2);
    const okTwo = two.length===2 && two.every(x => (x.pain==null || x.pain<=3) && morningAfter(x.date)!=='peor');
    if (ctx.backWorse) return {cls:'hold', txt:'Hoy no progreses: la espalda está más sensible. Reduce recorrido o repeticiones si molesta.', w: topW||null};
    if (!okTwo) return {cls:'', txt:`Mantén: ${topW?topW+' kg · ':''}${rng}${unit}. Regla médica: 2 sesiones seguidas sin aumento de síntomas para avanzar.`, w: topW||null};
    if (minR < it.r[1]) return {cls:'up', txt:`Listo para avanzar: +1-2 ${e.unit==='s'?'segundos':'repeticiones'} (hasta ${it.r[1]}${unit})${topW?' con '+topW+' kg':''}.`, w: topW||null, up:true};
    if (e.wt && topW) { const nw = r1(topW*1.075); return {cls:'up', txt:`Arriba del rango 2 sesiones sin síntomas: sube un 5-10% (≈${nw} kg) y vuelve a ${it.r[0]}${unit}.`, w: nw, up:true}; }
    return {cls:'', txt:'Ya dominas este ejercicio. Mantén la calidad hasta la siguiente fase.'};
  }
  if (!h.length) {
    if (e.t==='bw') return {cls:'', txt:`Primera vez: haz ${rng} dejando ${it.rir} repeticiones en reserva. Anota lo que salga.`};
    if (e.t==='hold') return {cls:'', txt:`Primera vez: aguanta ${rng} s con buena técnica.`};
    return {cls:'', txt:`Primera vez: elige un peso con el que hagas ${rng} dejando ${it.rir} en reserva.`};
  }
  const last = h[0], sets = last.sets;
  const topW = Math.max(0, ...sets.map(s=>s.w||0));
  const allTop = sets.length >= it.sets && sets.every(s => (s.r||0) >= it.r[1]);
  const anyLow = sets.filter(s => (s.r||0) < it.r[0]).length >= 2;
  const lastTxt = `Última vez (${fmtD(last.date)}): ${sets.map(s=>(s.w?s.w+'×':'')+(s.r||0)).join(' · ')}${unit}`;
  if (ctx.changeWeek) return {cls:'hold', txt:`Semana de cambio: suben series o ejercicios, así que mantén el peso. ${lastTxt}`, w: topW||null};
  if (ctx.backWorse) return {cls:'hold', txt:`Hoy no subas carga (espalda más sensible). ${lastTxt}`, w: topW||null};
  if (ctx.deload) return {cls:'hold', txt:`Descarga: mismo peso, 2 series cómodas. ${lastTxt}`, w: topW||null};
  if (allTop) {

}

/* ================== PLAN B (días fallados) ================== */
function strengthDoneDates(){ const out=[]; Object.keys(S.days).forEach(d => { const ss=S.days[d].sessions||{}; if (['A','B','C'].some(k=>isDone(ss[k]))) out.push(d); }); return out.sort(); }
function greedy(pending, from, m, cantToday){
  const sun = addDays(m,6), done = strengthDoneDates().filter(d=>d<from);
  let last = done.length ? done[done.length-1] : null;
  const strTodayDone = ['A','B','C'].some(k=>isDone(sess(from,k)));
  if (strTodayDone) last = from;
  const out = [], left = pending.slice();
  for (let d = from; d <= sun && left.length; d = addDays(d,1)) {
    if (d===from && (cantToday || strTodayDone)) continue;
    if (last && diffDays(last,d) < 2) continue;
    out.push({k:left.shift(), d, we: dow(d)>=5}); last = d;
  }
  return {out, left};
}
function planB(d){
  const w = progWeek(d); if (phaseOf(w)==='PRE') return null;
  const m = mondayOf(d), plan = weekSchedule(m), skips = S.cfg.skips[m]||[];
  const done = new Set(); for (let i=0;i<7;i++){ const dd=addDays(m,i); ['A','B','C'].forEach(k=>{ if(isDone(sess(dd,k))) done.add(k); }); }
  const pending = ['A','B','C'].filter(k => !done.has(k) && !skips.includes(k));
  const cantToday = pending.some(k => plan[k]===d && sess(d,k) && sess(d,k).status==='cant');
  const missed = pending.filter(k => plan[k] < d || (plan[k]===d && sess(d,k) && sess(d,k).status==='cant'));
  const res = {m, missed, pending, pool:null};
  // piscina
  const poolDone = [...Array(7)].some((_,i)=>isDone(sess(addDays(m,i),'pool')));
  const poolCant = sess(d,'pool') && sess(d,'pool').status==='cant';
  if (!poolDone && !skips.includes('pool') && (plan.pool < d || (plan.pool===d && poolCant))) res.pool = {cant: poolCant};
  if (!missed.length) return (res.pool ? res : null);
  const g = greedy(pending, d, m, cantToday);
  res.recover = g;
  const todayK = pending.find(k => plan[k]===d && !missed.includes(k));
  const lastDone = strengthDoneDates().filter(x=>x<d).pop();
  const canToday = !cantToday && !(lastDone && diffDays(lastDone,d)<2);
  res.fuse = (todayK && canToday) ? {today: todayK, missed: missed[0]} : null;
  const weekend = g.out.some(x=>x.we);
  res.rec = (!g.left.length && !weekend) ? 'recover' : (res.fuse ? 'fuse' : (!g.left.length ? 'recover' : 'skip'));
  return res;
}
function applyRecover(){
  const d = TODAY(), pb = planB(d); if (!pb || !pb.recover) return;
  const m = pb.m, wp = Object.assign({}, S.cfg.weekPlans[m]||{});
  pb.recover.out.forEach(x => wp[x.k] = x.d);
  S.cfg.weekPlans[m] = wp;
  if (pb.recover.left.length) S.cfg.skips[m] = [...(S.cfg.skips[m]||[]), ...pb.recover.left];
  saveCfg(); toast('Semana reorganizada'); render();
}
function applySkip(ks){ const m = mondayOf(TODAY()); S.cfg.skips[m] = [...new Set([...(S.cfg.skips[m]||[]), ...ks])]; saveCfg(); render(); }
function movePool(to){ const m = mondayOf(TODAY()); S.cfg.weekPlans[m] = Object.assign({}, S.cfg.weekPlans[m]||{}, {pool: to}); const s = sess(TODAY(),'pool'); if (s && s.status==='cant' && to===TODAY()) delete day(TODAY()).sessions.pool; saveCfg(); render(); }

function nutri(d){ const dd = day(d); const n = dd.nutri || (dd.nutri = {}); n.items = n.items || {}; n.meals = n.meals || {}; return n; }
function nOf(d){ return (S.days[d]||{}).nutri || null; }
function kcalOf(n){ if (!n) return 0; let k = 0; Object.values(n.items||{}).forEach(a=>a.forEach(x=>k += x.k*x.q)); if (!k && n.kcal) k = n.kcal; return Math.round(k); }
function protOf(n){ if (!n) return 0; let p = n.prot||0; Object.values(n.items||{}).forEach(a=>a.forEach(x=>p += x.p*x.q)); return Math.round(p); }
function mealK(n,m){ return Math.round(((n && n.items && n.items[m])||[]).reduce((a,x)=>a+x.k*x.q,0)); }
function mealDone(n,m){ return !!(n && ((n.items && n.items[m] && n.items[m].length) || (n.meals && n.meals[m]))); }
function mealTime(k){ return (S.cfg.times && S.cfg.times[k]) || (MEALS.find(x=>x[0]===k)||[])[2] || '12:00'; }
const tmin = t => { const [h,m] = String(t||'12:00').split(':').map(Number); let v = h*60+(m||0); if (h<4) v += 1440; return v; };
function nowMin(){ if (window.__NOWMIN!=null) return window.__NOWMIN; const d = new Date(); let v = d.getHours()*60+d.getMinutes(); if (d.getHours()<4) v += 1440; return v; }
function mealTarget(k){ const m = MEALS.find(x=>x[0]===k); return Math.round((S.cfg.kcal||2900)*m[3]/10)*10; }
function mealName(k){ return (MEALS.find(x=>x[0]===k)||[])[1] || k; }
function pace(d){
  const n = nOf(d), k = kcalOf(n), T = S.cfg.kcal||2900, now = d===TODAY() ? nowMin() : 99999;
  const due = MEALS.filter(m=>m[3]>0 && tmin(mealTime(m[0]))+45 <= now);
  const exp = due.reduce((a,m)=>a+mealTarget(m[0]),0);
  const next = MEALS.find(m=>m[3]>0 && !mealDone(n,m[0]) && tmin(mealTime(m[0]))+45 > now) || null;
  let st = 'ok', msg = '';
  if (k >= T-100) msg = k > T+400 ? 'Objetivo superado de largo. Si pasa a menudo, lo ajustamos.' : '¡Objetivo del día cumplido!';
  else if (!due.length) msg = `Día por delante: ${MEALS.filter(m=>m[3]>0).length} tomas para llegar a ${T} kcal.`;
  else if (k >= exp-150) msg = `Vas bien: a esta hora tocaba ≈${exp} kcal y llevas ${k}.`;
  else if (k >= exp*0.7) { st = 'warn'; msg = `Algo corto: te faltan ≈${exp-k} kcal respecto a lo previsto. ${next ? 'Súmalas a '+next[1].toLowerCase()+'.' : 'Usa la recena.'}`; }
  else { st = 'bad'; msg = `Vas por detrás: ≈${exp-k} kcal menos de lo previsto. ${next ? 'Refuerza '+next[1].toLowerCase()+' con un extra denso.' : 'Haz la recena: un batido denso cierra el hueco sin llenarte.'}`; }
  return {k, T, left: T-k, exp, st, msg, next, prot: protOf(n)};
}
function ring(val, max, col, size=132, stroke=12){

}

function weekAvgWeight(m){ const ws = [...Array(7)].map((_,i)=>((S.days[addDays(m,i)]||{}).check||{}).weight).filter(x=>x); return ws.length ? r1(ws.reduce((a,b)=>a+b,0)/ws.length) : null; }
function nutriWeek(d){
  const m = mondayOf(d), ds = [...Array(7)].map((_,i)=>addDays(m,i)).filter(x=>x<d || x===d);
  const past = ds.filter(x=>x<d), ns = past.map(x=>nOf(x)).filter(n=>n && kcalOf(n)>0);
  const avgK = ns.length ? Math.round(ns.reduce((a,n)=>a+kcalOf(n),0)/ns.length) : null;
  const pd = past.filter(x=>protOf(nOf(x))>=S.cfg.prot*0.9).length;
  const wa = [0,1,2].map(i=>weekAvgWeight(addDays(m,-7*i)));
  let rec = 'Pésate 3-4 mañanas por semana (en ayunas, tras ir al baño). La media semanal es la que manda.';
  if (wa[0] && wa[1]) { const g = r1(wa[0]-wa[1]), g2 = wa[2] ? r1((wa[0]-wa[2])/2) : null;
    if (g2!=null && g2 < 0.1) rec = `Ganancia media de ${g2} kg/sem en 2 semanas: por debajo del objetivo (0,15-0,4). Si has cumplido las calorías, súbelas ~150-200 kcal.`;
    else if (g2!=null && g2 > 0.5) rec = `Ganancia media de ${g2} kg/sem: algo rápida. Baja ~150 kcal para ganar más músculo y menos grasa.`;
    else rec = `Cambio esta semana: ${g>=0?'+':''}${g} kg. Objetivo: +0,15-0,4 kg/sem. Decide con 2-3 semanas de datos, no con una.`; }
  return `<div class="card"><h3>Esta semana</h3><div class="kv"><span class="mu">Media diaria registrada</span><b>${avgK?avgK+' kcal':'—'}</b></div>
    <div class="kv"><span class="mu">Días con proteína cumplida</span><b>${pd}/${past.length||0}</b></div>
    <div class="kv"><span class="mu">Peso medio</span><b>${wa[0]?wa[0]+' kg':'—'}</b></div><div class="kv"><span class="mu">Semana anterior</span><b>${wa[1]?wa[1]+' kg':'—'}</b></div><p class="sm mt8">${rec}</p></div>`;
}

function recentFoods(){

let R = null; // {d, kind, code, session, s}

function openSession(kind, d, code, opt={}){

}
let WL = null;

  const tot = def.blocks.reduce((a,b)=>a+b.items.reduce((x,it)=>x+it.sets,0),0), dn = def.blocks.reduce((a,b)=>a+b.items.reduce((x,it)=>x+Math.min(it.sets,((s.ex[it.id]||{}).sets||[]).filter(y=>y&&y.ok).length),0),0);

    h += `<div class="block"><div class="bl">${esc(b.label)}${b.items.length>1&&!b.warm?' ↔':''}</div>${b.note?`<div class="xs mu mt4">${esc(b.note)}</div>`:''}`;

function exCard(it, ctx, partner, ro){

  h += `<div class="sets"><div class="sethead ${cls}"><span>#</span>${head.map(x=>`<span>${x}</span>`).join('')}<span></span></div>`;

    const ck = `<button class="ck ${st.ok?'on':''}" data-act="setok" data-v="${it.id}|${i}|${it.rest||0}" ${ro?'disabled':''}>✓</button>`;

function lastPoolMorning(d){ const ks = Object.keys(S.days).sort().reverse().filter(k=>k<d && isDone((S.days[k].sessions||{}).pool)); return ks.length ? morningAfter(ks[0]) : null; }

/* temporizador de descanso */
let TIMER = {end:0, iv:null, ac:null};
function startRest(sec){
  if (!sec) return; stopRest();
  TIMER.end = Date.now() + sec*1000;
  const ac = getAC(); if (ac) { const g = ac.createGain(); g.connect(ac.destination); TIMER.g = g; const t0 = ac.currentTime + sec; beepAt(ac, g, t0-2, 660, 0.1, 0.2); beepAt(ac, g, t0-1, 660, 0.1, 0.2); beepAt(ac, g, t0, 990, 0.45); }
  TIMER.iv = setInterval(tick, 250); tick();
}
function stopRest(){ clearInterval(TIMER.iv); TIMER.iv=null; TIMER.end=0; if (TIMER.g) { try { TIMER.g.disconnect(); } catch(e){} TIMER.g = null; } const b=$('#restbar'); b.style.display='none'; }
function tick(){
  const b = $('#restbar'), left = Math.ceil((TIMER.end - Date.now())/1000);
  if (!R || !TIMER.end) { b.style.display='none'; return; }
  b.style.display='block';
  b.innerHTML = `<div class="in"><div class="timer ${left<=0?'go':''}">${left>0?Math.floor(left/60)+':'+pad(left%60):'¡Ya!'}</div><div class="grow sm mu">${left>0?'Descanso · haz el ejercicio ↔ si toca':'Siguiente serie'}</div><button class="btn sm" data-act="rest+">+15″</button><button class="btn sm ghost" data-act="reststop">✕</button></div>`;
  if (left <= -8) stopRest();
}

/* ================== CRONÓMETRO (solo ejercicios por tiempo) ================== */
function getAC(){ try { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; TIMER.ac = TIMER.ac || new AC(); if (TIMER.ac.state==='suspended') TIMER.ac.resume(); return TIMER.ac; } catch(e){ return null; } }
function beepAt(ac, dest, at, f, dur, vol=0.3){ try { const o = ac.createOscillator(), g = ac.createGain(); o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.0001, at+dur); o.connect(g); g.connect(dest); o.start(at); o.stop(at+dur+0.05); } catch(e){} }
let TM = null;
function timedStart(id, i){
  readSetInputs();
  const it = findItem(id), e = EX[id]; if (!it) return;
  const log = R.s.ex[id] || (R.s.ex[id] = {sets:[], pain:null}); const st = log.sets[i] = log.sets[i] || {};
  let T = st.r;
  if (!T) { const hh = history(id, R.d); T = hh.length ? Math.max(...hh[0].sets.map(x=>x.r||0)) : it.r[0]; }
  T = Math.max(5, Math.round(T));
  const sides = e.per ? 2 : 1, PREP = 5, SW = 5, ph = [{k:'prep', l:'Prepárate', d:PREP}];
  for (let s=0; s<sides; s++){ if (s) ph.push({k:'sw', l:'Cambia de lado', d:SW}); ph.push({k:'work', l: sides>1 ? (s ? 'Segundo lado' : 'Primer lado') : (/granjero|cargar/.test(id) ? '¡Camina!' : '¡Aguanta!'), d:T}); }
  let acc = 0; ph.forEach(p => { p.a = acc; acc += p.d; });
  TM = {id, i, T, ph, total: acc, t0: performance.now(), rest: it.rest || 0, name: e.n, set: i+1, sets: it.sets, g: null};
  const ac = getAC();
  if (ac) { const g = ac.createGain(); g.gain.value = 1; g.connect(ac.destination); TM.g = g; const b = ac.currentTime + 0.05;
    ph.forEach(p => {
      if (p.k!=='work') { for (let s=p.d-3; s<p.d; s++) beepAt(ac, g, b+p.a+s, 660, 0.12); }
      else { beepAt(ac, g, b+p.a, 990, 0.45); for (let s=p.d-3; s<p.d; s++) if (s>0) beepAt(ac, g, b+p.a+s, 520, 0.08, 0.18); }
    });
    beepAt(ac, g, b+acc, 1320, 0.8); }
  wakeOn();
  TM.iv = setInterval(timedTick, 100); timedTick();
}
function timedTick(){
  if (!TM) return;
  const el = $('#tmr'), t = (performance.now()-TM.t0)/1000;
  if (t >= TM.total) { timedEnd(true); return; }
  const cur = TM.ph.find(p => t >= p.a && t < p.a+p.d) || TM.ph[0], left = Math.ceil(cur.a + cur.d - t), frac = (t-cur.a)/cur.d;
  const R0 = 118, C = 2*Math.PI*R0, col = cur.k==='work' ? 'var(--ac)' : 'var(--sw)';
  el.className = 'on' + (cur.k==='work' ? ' work' : '');
  el.innerHTML = `<div class="eyebrow">${esc(TM.name)} · serie ${TM.set}/${TM.sets}</div><div class="lbl mt8" style="color:${col}">${cur.l}</div><div class="sub2">${cur.k==='work' ? 'Objetivo: '+TM.T+' s' : cur.k==='prep' ? 'Colócate. Empieza en…' : 'Siguiente lado en…'}</div>
    <div class="clock"><svg viewBox="0 0 260 260"><circle cx="130" cy="130" r="${R0}" fill="none" stroke="rgba(28,34,48,.08)" stroke-width="14"/><circle cx="130" cy="130" r="${R0}" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*frac).toFixed(1)}"/></svg><div class="num">${left}</div></div>
    <div class="tb">${cur.k==='work'?`<button class="btn pri" data-act="tstop">■ Parar</button>`:''}<button class="btn ghost" data-act="tcancel">Cancelar</button></div>`;
}
function timedEnd(full){
  if (!TM) return;
  clearInterval(TM.iv);
  const t = (performance.now()-TM.t0)/1000, el = $('#tmr');
  if (full !== true && TM.g) { try { TM.g.disconnect(); } catch(e){} }
  let rec = null;
  if (full === true) rec = TM.T;
  else if (full === false) { const cur = TM.ph.find(p => t >= p.a && t < p.a+p.d); rec = cur && cur.k==='work' ? Math.floor(t-cur.a) : null; }

  if (rec != null && rec >= 1 && R) {

async function copyText(t, okMsg){
  try { await navigator.clipboard.writeText(t); toast(okMsg||'Copiado'); }
  catch(e){ modal(`<h3>Copia manual</h3><p class="sm mu mt4">Mantén pulsado el texto → Seleccionar todo → Copiar.</p><textarea rows="8" class="mt8" readonly>${esc(t)}</textarea><button class="btn full mt12" data-act="mclose">Cerrar</button>`); }
}
function importData(txt){
  let o; try { o = JSON.parse(txt); } catch(e){ toast('Ese texto no es una copia válida'); return; }
  if (!o || o.app!=='plan-jose' || !o.days) { toast('Ese texto no es una copia válida'); return; }
  modal(`<h3>¿Restaurar la copia?</h3><p class="sm mt8">Se sustituirán los datos actuales por los de la copia del ${esc((o.exportedAt||'').slice(0,10))} (${Object.keys(o.days).length} días).</p><div class="btns"><button class="btn pri" data-act="impok">Restaurar</button><button class="btn ghost" data-act="mclose">Cancelar</button></div>`);
  window.__imp = o;
}
async function doImport(){
  const o = window.__imp; if (!o) return;
  S.cfg = Object.assign(defCfg(), o.cfg); S.days = o.days; const now = Date.now(); S.cfg.updatedAt = now;
  Object.values(S.days).forEach(dd => dd.updatedAt = now);
  saveLocal(); closeModal(); toast('Copia restaurada'); render();
  if (DB) { try { await DB.doc('config/settings').set(clone(S.cfg)); for (const k of Object.keys(S.days)) await DB.doc('days/'+k).set(clone(S.days[k])); } catch(e){ setSync('error'); } }
}
function summaryText(m){
  const ds = [...Array(7)].map((_,i)=>addDays(m,i)), w = progWeek(m);
  let t = `RESUMEN SEMANA ${w} (${fmtD(m)}-${fmtD(addDays(m,6))}) · ${PH[phaseOf(w)].name}\n`;
  ds.forEach(d => { const dd = S.days[d]; if (!dd) return; const parts = [];
    if (dd.check) parts.push(`check: espalda ${dd.check.back||'-'}, dolor ${dd.check.pain??'-'}/10${dd.check.sleep?', sueño '+dd.check.sleep+'h':''}${dd.check.weight?', '+dd.check.weight+' kg':''}`);
    Object.values(dd.sessions||{}).forEach(s => {
      if (s.kind==='pool'||s.kind==='opt') { if (isDone(s)) parts.push(`piscina ${SWIM[s.code].name}: ${s.swim&&s.swim.m||SWIM[s.code].m} m, RPE ${s.swim&&s.swim.rpe||'-'}, braza ${s.swim&&s.swim.braza||'-'}, dolor ${s.swim&&s.swim.pain!=null?s.swim.pain:'-'}`); else if (s.status==='cant') parts.push('piscina: no pudo'); return; }
      if (s.status==='cant') { parts.push(`${s.kind}: no pudo (${s.reason||''})`); return; }
      if (!isDone(s)) return;
      const ex = Object.entries(s.ex||{}).map(([id,x])=>{ const ok=(x.sets||[]).filter(y=>y&&y.ok); if(!ok.length) return null; return `${EX[id].n}: ${ok.map(y=>(y.w?y.w+'x':'')+(y.r||0)+(y.rir!=null&&y.rir!==''?'@'+y.rir:'')).join(' ')}${x.pain!=null&&x.pain!==''?' [dolor '+x.pain+']':''}`; }).filter(Boolean);
      parts.push(`${s.kind==='med'?'Movilidad':W[s.kind].name}${s.variant==='express'?' (exprés)':''}${s.pain!=null?' · dolor máx '+s.pain:''}${s.note?' · nota: '+s.note:''}\n   - ${ex.join('\n   - ')}`);
    });
    if (dd.walk) parts.push(`caminar ${dd.walk} min`);
    if (dd.nutri && (kcalOf(dd.nutri) || protOf(dd.nutri))) parts.push(`nutrición: ${kcalOf(dd.nutri)} kcal, ${protOf(dd.nutri)} g prot (${MEALS.filter(([k])=>mealDone(dd.nutri,k)).map(([k])=>mealName(k)+' '+mealK(dd.nutri,k)).join(', ')})${dd.nutri.creat?', creatina':''}${dd.nutri.mg?', magnesio':''}`);
    if (parts.length) t += `\n${fmtDL(d)}\n  ${parts.join('\n  ')}`;
  });
  const wa = weekAvgWeight(m); if (wa) t += `\n\nPeso medio: ${wa} kg`;
  return t;
}

/* ================== RENDER PRINCIPAL ================== */
function render(){
  const v = {hoy:viewHoy, plan:viewPlan, prog:viewProg, com:viewCom, mas:viewMas}[TAB]();
  $('#app').innerHTML = v; $('#nav').innerHTML = nav();
  if (R) renderRunner();
  clearTimeout(window.__cel); window.__cel = setTimeout(checkCelebrations, 600);
}

/* ================== EVENTOS ================== */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]'); if (!t) return;

    case 'gosync': TAB='mas'; SUB.mas='copia'; closeRunner(); render(); break;
    case 'gosettings': TAB='mas'; SUB.mas='copia'; render(); window.scrollTo(0,0); break;

    case 'pw': PLANW = Math.max(1, PLANW + (+v)); render(); break;
    case 'ck': { readInputs(); const c = (day(d).check = day(d).check || {}); c[t.dataset.f] = v; render(); break; }
    case 'scale': {
      if (t.dataset.n==='ckpain') { readInputs(); const c = (day(d).check = day(d).check || {}); c.pain = +v; render(); }
      if (t.dataset.n==='swpain' && R) { R.s.swim = R.s.swim||{}; R.s.swim.pain = +v; saveDay(R.d); renderRunner(); }
      if (t.dataset.n==='fpain') { window.__fin.pain = +v; finishModal(); }
      break; }
    case 'cksave': { const c = day(d).check || {}; if (c.pain==null) { toast('Indica el dolor (0 si no hay)'); return; } readInputs(); c.saved = true; saveDay(d); toast('Check-in guardado'); render(); break; }
    case 'recheck': { const c = day(d).check; if (c) c.saved = false; render(); break; }
    case 'walk': { const dd = day(t.dataset.d); dd.walk = Math.max(0,(dd.walk||0) + (+v)); saveDay(t.dataset.d); render(); break; }
    case 'open': closeModal(); openSession(t.dataset.k, t.dataset.d, t.dataset.code); break;
    case 'petname': { const nm = ($('#petname').value||'').trim(); if (!nm) { toast('Escribe un nombre'); return; } S.cfg.pet.name = nm; saveCfg(); toast('¡Hola, '+nm+'!'); render(); break; }
    case 'pettap': case 'pettap2': petHearts(t); pupJoy(); break;
    case 'look': { S.cfg.pet.look = v || null; saveCfg(); if (t.dataset.close) closeModal(); toast(v ? 'Look puesto' : 'Avatar de etapa'); render(); break; }
    case 'accinfo': { const a = ACCS.find(x=>x[0]===v); if (WEARABLE.includes(v)) { const eq = S.cfg.pet.equip; eq[v] = eq[v]===false; saveCfg(); toast(`${a[1]}: ${eq[v]===false?'guardado':'puesto'}${v==='goggles'?' (se ve en la piscina)':''}`); render(); } else toast(`${a[1]}: ${a[3]} ✓`); break; }
    case 'pbub': { const [k, x] = v.split(':');
      if (k==='checkin') { const el = document.querySelector('[data-act="cksave"]'); if (el) el.closest('.card').scrollIntoView({behavior:'smooth', block:'center'}); else { const c = day(d).check; if (c) c.saved = false; render(); } }
      else if (k==='open') { const it = dayItems(d).find(i=>i.kind===x); openSession(x, d, it && it.code); }
      else if (k==='food') openFoodSheet(x);
      else if (k==='creat') { const n = nutri(d); n.creat = true; saveDay(d); toast('Creatina ✓ +3 XP'); render(); }
      else if (k==='water') { const n = nutri(d); n.water = (n.water||0)+1; saveDay(d); toast('+1 vaso de agua'); render(); }
      else if (k==='esp') { TAB='mas'; SUB.mas='esp'; render(); }
      else petHearts(t);
      break; }
    case 'gfood': { const p = pace(d); openFoodSheet(p.next ? p.next[0] : 'noc'); break; }
    case 'gprot': { const p = pace(d); openFoodSheet(p.next ? p.next[0] : 'noc'); FS.cat='sup'; renderFoodSheet(); break; }
    case 'gwater': { const n = nutri(d); n.water = (n.water||0)+1; saveDay(d); render(); toast(`Agua: ${n.water}/8`); break; }
    case 'gcreat': { const n = nutri(d); n.creat = !n.creat; saveDay(d); render(); break; }
    case 'equipdb': S.cfg.pet.db = v; saveCfg(); toast('Pesas '+v+' elegidas'); render(); break;
    case 'locked': toast('🔒 Aún bloqueado: sigue así'); break;
    case 'badge': { const [n, val, next, u] = v.split('|'); toast(next ? `${n}: ${val||0} ${u}. Siguiente nivel: ${next} ${u}` : `${n}: ¡nivel máximo!`); break; }
    case 'pv': PLANV = v; render(); break;
    case 'mm': { const d0 = parse(PLANM); d0.setMonth(d0.getMonth() + (+v)); PLANM = ymd(d0).slice(0,8)+'01'; render(); break; }
    case 'mday': dayDetail(v); break;
    case 'toweek': closeModal(); PLANV = 'week'; PLANW = Math.max(1, progWeek(v)); render(); break;
    case 'cant': cantModal(t.dataset.k); break;
    case 'cant-do': { const k = t.dataset.k, r = t.dataset.v; const dd = day(d); dd.sessions = dd.sessions||{}; dd.sessions[k] = Object.assign(dd.sessions[k]||{kind:k, week:progWeek(d)}, {status:'cant', reason:r}); saveDay(d); closeModal(); render(); break; }
    case 'cant-exp': { closeModal(); openSession(t.dataset.k, d, '', {variant:'express'}); break; }
    case 'cant-med': { const k = t.dataset.k; const dd = day(d); dd.sessions = dd.sessions||{}; dd.sessions[k] = Object.assign(dd.sessions[k]||{kind:k, week:progWeek(d)}, {status:'cant', reason:'espalda'}); saveDay(d); closeModal(); openSession('med', d); break; }
    case 'pb-recover': applyRecover(); break;
    case 'pb-fuse': openSession(t.dataset.k, d, '', {fuse: t.dataset.m}); break;
    case 'pb-skip': applySkip(v.split(',')); toast('Hecho. Seguimos.'); break;
    case 'pool-move': movePool(v); toast(v===d?'Piscina hoy':'Piscina movida al '+DN[dow(v)].toLowerCase()); break;
    case 'repeat': modal(`<h3>¿Repetir la semana?</h3><p class="sm mt8">La semana actual pasará a ser otra vez la semana ${Math.max(1,progWeek(d)-1)}, con los mismos ejercicios y cargas. Útil si la anterior fue floja o la espalda protestó.</p><div class="btns"><button class="btn pri" data-act="repeatok">Repetir</button><button class="btn ghost" data-act="mclose">Cancelar</button></div>`); break;
    case 'repeatok': S.cfg.repeats = (S.cfg.repeats||0)+1; saveCfg(); closeModal(); PLANW=null; toast('Semana repetida'); render(); break;
    case 'unrepeat': S.cfg.repeats = Math.max(0,(S.cfg.repeats||0)-1); saveCfg(); render(); break;
    case 'altack': { S.cfg.altaChecks = S.cfg.altaChecks||{}; S.cfg.altaChecks[v] = !S.cfg.altaChecks[v]; saveCfg(); render(); break; }
    case 'alta': { const w = progWeek(d); const started = ['A','B','C'].some(k=>{ for(let i=0;i<7;i++) if (isDone(sess(addDays(mondayOf(d),i),k))) return true; return false; });
      S.cfg.alta = true; S.cfg.altaWeek = Math.max(9, started ? w+1 : w); saveCfg(); toast('¡Alta! Bloque 3 desde la semana '+S.cfg.altaWeek); render(); break; }
    case 'unalta': S.cfg.alta=false; S.cfg.altaWeek=null; saveCfg(); render(); break;
    case 'startnow': { const m = mondayOf(d); S.cfg.start = m; S.cfg.repeats = 0; const g = greedy(['A','B','C'], d, m, false); const wp = {}; g.out.forEach(x=>wp[x.k]=x.d); S.cfg.weekPlans[m] = Object.assign(wp, {pool: dow(d)<=1 ? addDays(m,1) : addDays(d, ['A','B','C'].some(k=>wp[k]===d)?1:0)}); if (g.left.length) S.cfg.skips[m] = g.left; saveCfg(); toast('¡Plan en marcha!'); render(); break; }
    case 'addfood': openFoodSheet(t.dataset.m); break;
    case 'fcat': FS.cat = v; FS.search = ''; renderFoodSheet(); break;
    case 'fq': FS.q = +v; $('#fslist').innerHTML = foodRows(); document.querySelectorAll('.qty button').forEach(b=>b.classList.toggle('on', +b.dataset.v===FS.q)); break;
    case 'fadd': { const f = FS.list[+v]; if (!f) return; addFood(FS.meal, f, FS.q); FS.q = 1; $('#fsk').textContent = mealK(nOf(d), FS.meal); $('#fslist').innerHTML = foodRows(); document.querySelectorAll('.qty button').forEach(b=>b.classList.toggle('on', +b.dataset.v===1)); render(); break; }
    case 'fmanual': { const nm = ($('#fmn').value||'').trim() || 'Alimento', k = num($('#fmk').value), pr = num($('#fmp').value) || 0;
      if (k==null) { toast('Indica las kcal'); return; }
      if ($('#fms').checked) { S.cfg.foods = (S.cfg.foods||[]).filter(f=>f[0]!==nm); S.cfg.foods.unshift([nm,k,pr]); saveCfg(); }
      addFood(FS.meal, [nm,k,pr], 1); renderFoodSheet(); render(); break; }
    case 'fsclose': FS = null; closeModal(); render(); break;
    case 'fdel': { const n = nutri(d); n.items[t.dataset.m].splice(+v,1); saveDay(d); render(); break; }
    case 'frepeat': { const y = nOf(addDays(d,-1)), n = nutri(d); n.items[t.dataset.m] = clone(y.items[t.dataset.m]); saveDay(d); toast('Copiado de ayer'); render(); break; }
    case 'fsnack': { const sn = SNACKS[+v]; addFood(t.dataset.m, [sn[0], sn[2], sn[3]], 1); render(); break; }
    case 'fquick': { const f = FOODS.find(x=>x[0]===v); const p = pace(d); const now = nowMin();
      const cur = [...MEALS].reverse().find(m=>tmin(mealTime(m[0]))-60 <= now) || MEALS[0]; addFood(cur[0], f, 1); render(); break; }
    case 'supp': { const n = nutri(d); n[v] = !n[v]; saveDay(d); render(); break; }
    case 'tstart': { const [id,i] = v.split('|'); timedStart(id, +i); break; }
    case 'tstop': timedEnd(false); break;
    case 'tcancel': timedEnd(null); break;
    case 'nstep': { const n = nutri(d); n[t.dataset.f] = Math.max(0,(n[t.dataset.f]||0)+(+v)); saveDay(d); render(); break; }
    case 'wsave': { readInputs(); saveDay(d); toast('Peso guardado'); render(); break; }
    case 'mzsave': { readInputs(); saveDay(d); toast('Medidas guardadas'); render(); break; }
    case 'exp-copy': copyText(exportJSON(), 'Copia de seguridad copiada'); markBackup(); break;
    case 'exp-dl': (async()=>{ const fn = 'wolfy-'+d+'.json';
      if (DL) { try { await DL.save({filename:fn, data: exportJSON()}); markBackup(); } catch(e){ toast('Descarga cancelada'); } return; }
      try { const file = new File([exportJSON()], fn, {type:'application/json'});
        if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:'Copia de Wolfy'}); markBackup(); toast('Copia guardada'); }
        else { const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = fn; document.body.appendChild(a); a.click(); a.remove(); markBackup(); }
      } catch(e){ if (e && e.name!=='AbortError') toast('No se pudo guardar'); }
      render(); })(); break;
    case 'imp-txt': importData(($('#imptxt')||{}).value||''); break;
    case 'impok': doImport(); break;
    case 'copysum': copyText(summaryText(t.dataset.m), 'Resumen copiado: pégalo en tu chat con Claude'); break;
    case 'reset': modal(`<h3>¿Borrar todo?</h3><p class="sm mt8">Se borran los datos de este dispositivo. ${DB?'Los guardados en tu cuenta se mantienen y volverán al recargar.':'Haz antes una copia de seguridad.'}</p><div class="btns"><button class="btn" style="background:var(--bad);color:#fff" data-act="resetok">Borrar</button><button class="btn ghost" data-act="mclose">Cancelar</button></div>`); break;
    case 'resetok': try{ localStorage.removeItem(LS); }catch(e){} S = {cfg:defCfg(), days:{}}; closeModal(); render(); break;
    case 'mclose': closeModal(); break;
    // runner
    case 'rclose': closeRunner(); render(); break;
    case 'variant': R.s.variant = v; renderRunner(); break;
    case 'setok': { const [id,i,rest] = v.split('|'); const log = R.s.ex[id] || (R.s.ex[id]={sets:[],pain:null}); readSetInputs(); const st = log.sets[+i] = log.sets[+i] || {};
      if (!st.ok) { const it = findItem(id); if (st.r==null) st.r = it ? (EX[id].t==='med'?it.r[1]:null) : null;
        if (st.w==null) { const inp = document.querySelector(`[data-set="${id}|${i}|w"]`); const ph = inp && num(inp.placeholder); if (ph!=null) st.w = ph; }
        if (st.r==null) { toast('Anota las repeticiones'); return; }
        st.ok = true; if (R.s.status==='new') { R.s.status='progress'; R.s.startedAt = Date.now(); } startRest(+rest); }
      else st.ok = false;
      saveDay(R.d); renderRunner(); break; }
    case 'rest+': { const left = Math.max(0,(TIMER.end-Date.now())/1000)+15; startRest(Math.round(left)); break; }
    case 'reststop': stopRest(); break;
    case 'finish': window.__fin = {pain: null, feel: null, note: ''}; finishModal(); break;
    case 'feel': window.__fin.feel = +v; finishModal(); break;
    case 'finok': { readSetInputs(); const f = window.__fin; f.note = ($('#finnote')||{}).value || ''; const def = sessionDef();
      const total = def.blocks.reduce((a,b)=>a+b.items.reduce((x,it)=>x+it.sets,0),0), ok = Object.values(R.s.ex).reduce((a,x)=>a+(x.sets||[]).filter(y=>y&&y.ok).length,0);
      Object.assign(R.s, {status: ok>=total*0.7 ? 'done' : 'partial', pain: f.pain, feel: f.feel, note: f.note, endedAt: Date.now()});
      if (R.s.fuse) applySkip([R.s.fuse]);
      saveDay(R.d); closeModal(); stopRest(); showSummary(); break; }
    case 'reopen': R.s.status = (R.kind==='pool'||R.kind==='opt') ? 'progress' : 'progress'; renderRunner(); break;
    case 'swck': { if (isDone(R.s)) return; R.s.done = R.s.done || []; R.s.done[+v] = !R.s.done[+v]; saveDay(R.d); renderRunner(); break; }
    case 'swb': { R.s.swim = R.s.swim||{}; R.s.swim.braza = v; saveDay(R.d); renderRunner(); break; }
    case 'poolfinish': { readSwim(); R.s.status='done'; R.s.endedAt = Date.now(); saveDay(R.d); toast('Piscina registrada 🏊'); closeRunner(); render(); break; }
    case 'sumclose': closeModal(); closeRunner(); render(); break;
  }
});
function closeRunner(){ readSetInputs(); readSwim(); if (R) saveDay(R.d); R = null; stopRest(); wakeOff(); renderRunner(); }
function findItem(id){ const def = sessionDef(); for (const b of def.blocks) for (const it of b.items) if (it.id===id) return it; return null; }
function cantModal(k){
  const name = k==='pool' ? 'la piscina' : k==='med' ? 'la movilidad' : W[k].name;
  modal(`<h3>¿Qué pasa hoy?</h3><p class="sm mu mt4">Elige y te propongo la mejor alternativa para ${esc(name)}.</p><div class="col mt12">
    ${['A','B','C'].includes(k)?`<button class="btn full pri" data-act="cant-exp" data-k="${k}">⏱ Tengo poco tiempo → versión exprés (≈30′)</button>
    <button class="btn full" data-act="cant-exp" data-k="${k}">🔋 Estoy cansado → exprés y sin subir pesos</button>
    <button class="btn full" data-act="cant-med" data-k="${k}">🩺 Me molesta la espalda → movilidad + paseo</button>`:''}
    <button class="btn full ghost" data-act="cant-do" data-k="${k}" data-v="no-puedo">✕ Hoy no puedo → muévela a otro día</button></div>`);
}
function finishModal(){
  const f = window.__fin;
  modal(`<h3>Terminar sesión</h3><label class="f">Dolor lumbar máximo durante la sesión</label>${scale('fpain', f.pain)}
    <label class="f">¿Qué tal te has sentido?</label><div class="opt4">${['😫','😐','🙂','💪'].map((e,i)=>`<button data-act="feel" data-v="${i+1}" class="${f.feel===i+1?'on':''}" style="font-size:22px">${e}</button>`).join('')}</div>
    <label class="f">Nota (opcional)</label><input id="finnote" value="${esc(f.note||'')}" placeholder="p. ej. la búlgara me tiró un poco">
    <button class="btn pri full mt16" data-act="finok">Guardar</button>`);
}
function showSummary(){
  const def = sessionDef(), ctx = {date: addDays(R.d,1)}; const ups = [];
  def.blocks.forEach(b=>b.items.forEach(it=>{ const sg = suggest(it, ctx); if (sg.up) ups.push(EX[it.id].n + (sg.w?' → '+sg.w+' kg':'')); }));
  const n = Object.values(R.s.ex).reduce((a,x)=>a+(x.sets||[]).filter(y=>y&&y.ok).length,0);
  const p = R.s.pain;
  const stp = petStats(), nxs = STAGES[stp.stage+1];
  modal(`<img src="${IMG('look_strength')}" alt="" class="celimg"><div style="text-align:center" class="mt4"><span class="chip pet">${esc(petName())}: ${stp.ses} sesiones${nxs?` · ${Math.round(stp.nextFrac*100)}% hacia ${nxs.n}`:''}</span></div><h2 style="text-align:center" class="mt8">${R.s.status==='done'?'¡Sesión completada!':'Sesión registrada'}</h2>
    <p class="sm mu mt8" style="text-align:center">${n} series hechas${p!=null?` · dolor máx. ${p}/10`:''}</p>
    ${p!=null&&p>3?`<div class="card warn tight"><div class="sm">Dolor por encima de 3/10. Mañana el check-in dirá si se normalizó: si amaneces peor, la próxima sesión mantiene cargas.</div></div>`:''}
    ${ups.length?`<div class="card ac tight"><div class="sm b">Para la próxima vez sube en:</div><ul class="list sm">${ups.map(u=>`<li>${esc(u)}</li>`).join('')}</ul></div>`:''}
    <p class="sm mt12">Ahora: comida con proteína e hidratos en las próximas 2 horas. ${R.s.status==='done'?'Constancia > perfección.':'Una sesión parcial también cuenta.'}</p>
    <button class="btn pri full mt16" data-act="sumclose">Listo</button>`);
}
function readSetInputs(){
  if (!R || !R.s.ex) return;
  document.querySelectorAll('[data-set]').forEach(el => { const [id,i,f] = el.dataset.set.split('|'); const log = R.s.ex[id] || (R.s.ex[id]={sets:[],pain:null}); const st = log.sets[+i] = log.sets[+i] || {};
    const val = f==='rir' ? (el.value===''?null:+el.value) : num(el.value); if (val!=null || el.value==='') st[f] = val; });
  document.querySelectorAll('[data-pain]').forEach(el => { const log = R.s.ex[el.dataset.pain]; if (log) log.pain = el.value===''?null:+el.value; });
}
